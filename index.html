<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0d1a" />
  <title>AFK 주식회사 — 방치형 AI 제국</title>
  <meta name="description" content="첫 봇을 고용해 방치하는 사이 AI가 돈을 법니다. 클릭 한 번으로 시작하는 방치형 머니 게임." />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Title screen -->
  <div id="title" class="title">
    <div class="title-inner">
      <div class="title-badge">IDLE · AI · EMPIRE</div>
      <h1 class="title-logo">AFK<br /><span>주식회사</span></h1>
      <p class="title-tag">방치하는 사이, AI가 당신의 돈을 법니다.</p>
      <button id="startBtn" class="start-btn">시작하기</button>
      <p id="titleNote" class="title-note">첫 봇을 고용해 제국을 시작하세요</p>
    </div>
  </div>

  <!-- Toast stack -->
  <div id="toasts" class="toasts"></div>

  <!-- App -->
  <main class="app">
    <!-- Top HUD -->
    <header class="hud">
      <div class="hud-left">
        <div class="money-row">
          <span class="won">₩</span>
          <span id="money" class="money">0</span>
        </div>
        <div id="persec" class="persec">₩0 / 초</div>
      </div>
      <div class="hud-right">
        <div id="ppOwned" class="pp">특이점 코인 0</div>
        <button id="mute" class="mute" aria-label="음소거 토글">🔊</button>
      </div>
    </header>

    <!-- Scene / diorama -->
    <section class="scene-wrap">
      <div id="tower" class="scene"></div>
    </section>

    <!-- Clicker -->
    <section class="clicker-wrap">
      <button id="clicker" class="clicker" aria-label="돈 벌기">
        <span class="clicker-emoji">💰</span>
        <span class="clicker-label">탭해서 벌기</span>
      </button>
      <div id="clickval" class="clickval">클릭당 +₩1</div>
    </section>

    <!-- Rewarded boost -->
    <button id="boostBtn" class="boost" type="button">
      <span class="boost-ic">📺</span>
      <span class="boost-tx">광고 보고 <b>2배 부스터</b> (60초)</span>
    </button>
    <div id="boostBar" class="boost-active hidden">
      <div class="boost-active-tx">🔥 2배 부스터 <span id="boostTime">60</span>초</div>
      <div class="boost-prog"><span id="boostProg"></span></div>
    </div>

    <!-- Buy mode -->
    <div class="buymode" role="group" aria-label="구매 수량">
      <button data-mode="1" class="on">×1</button>
      <button data-mode="10">×10</button>
      <button data-mode="100">×100</button>
      <button data-mode="max">MAX</button>
    </div>

    <!-- Generators -->
    <section class="panel">
      <h2 class="panel-h">수익원</h2>
      <div id="gens" class="list"></div>
    </section>

    <!-- Upgrades -->
    <section class="panel">
      <h2 class="panel-h">강화 · 자동화</h2>
      <div id="ups" class="list"></div>
    </section>

    <!-- Prestige -->
    <section class="panel prestige-panel">
      <h2 class="panel-h">🌌 특이점 리셋</h2>
      <p id="prestigeInfo" class="prestige-info">₩1B 이상 벌면 리셋 가능.</p>
      <button id="prestigeBtn" class="prestige-btn" disabled>리셋 불가</button>
    </section>

    <footer class="foot">© AFK 주식회사 · 방치형 머니 게임</footer>
  </main>

  <!-- Offline earnings modal -->
  <div id="offlineModal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-emoji">😴💰</div>
      <h3 class="modal-title">돌아온 사이 벌었어요!</h3>
      <div id="offlineEarned" class="modal-amount">₩0</div>
      <p id="offlineText" class="modal-text"></p>
      <button id="offlineDoubleBtn" class="modal-ad">📺 광고 보고 <b>2배</b>로 받기</button>
      <button id="offlineOk" class="modal-ok">그냥 받기</button>
    </div>
  </div>

  <script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
  <script src="game.js"></script>
</body>
</html>
